name: MCP catalog drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify vendored MCP catalog
        run: node scripts/verify-catalog-sync.mjs
      - name: Validate skills and generated references
        run: |
          node scripts/validate.mjs
          node scripts/generate.mjs --check
