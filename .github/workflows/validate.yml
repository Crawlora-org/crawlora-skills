name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint SKILL.md frontmatter + body
        run: node scripts/validate.mjs
      - name: Generator parity (reference/ + bundled helper up to date)
        run: node scripts/generate.mjs --check
      - name: Shell helper syntax
        run: bash -n lib/crawlora.sh
      - name: Helper regression tests
        run: node --test scripts/helper.test.mjs
      - name: Focused endpoint selection
        run: node --test scripts/select-tools.test.mjs
